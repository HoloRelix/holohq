<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0A0912" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>HoloHQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100vh;
        background: #0A0912; overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        width: 100%; min-height: 100vh;
        background: #0A0912; overflow-x: hidden;
        position: relative;
      }
      /* Phone — full width, bottom nav */
      @media (max-width: 767px) {
        #root { max-width: 100%; }
      }
      /* Tablet + Desktop — full width, sidebar nav */
      @media (min-width: 768px) {
        #root { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
