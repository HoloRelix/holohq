<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0A0912" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>HoloHQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100vh;
        background: #0A0912; overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        display: flex; justify-content: center; align-items: flex-start;
      }
      #root {
        width: 100%; min-height: 100vh;
        background: #0A0912; overflow-x: hidden;
        position: relative; flex-shrink: 0;
      }
      /* Phone — full width */
      @media (max-width: 480px) {
        #root { max-width: 100%; }
      }
      /* Tablet — wider, good for kiosk */
      @media (min-width: 481px) and (max-width: 1024px) {
        #root { max-width: 768px; }
      }
      /* Desktop — phone shell */
      @media (min-width: 1025px) {
        body { align-items: center; padding: 24px 0; }
        #root {
          max-width: 430px;
          min-height: calc(100vh - 48px);
          border-radius: 40px;
          box-shadow: 0 0 0 10px #1a1730, 0 0 80px rgba(139,92,246,0.3);
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
